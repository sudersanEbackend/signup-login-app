<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
    }

    /* NAVBAR */
    .navbar {
      background: #0b2c5f;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
    }

    .navbar h2 {
      margin: 0;
    }

    /* HERO */
    .hero {
      background: #ddd;
      padding: 50px;
      text-align: center;
    }

    .hero button {
      padding: 10px 20px;
      background: #0b2c5f;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* CATEGORIES */
    .categories {
      text-align: center;
      padding: 20px;
    }

    .category-list span {
      background: white;
      padding: 8px 15px;
      margin: 5px;
      display: inline-block;
      border-radius: 20px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }

    /* CARDS */
    .cards {
      display: flex;
      gap: 20px;
      padding: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      width: 250px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card button {
      margin-top: 10px;
      padding: 8px;
      width: 100%;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- 🔹 NAVBAR -->
<div class="navbar">
  <h2>STACKLY</h2>
  <button onclick="logout()">Logout</button>
</div>

<!-- 🔹 HERO -->
<div class="hero">
  <h1>Welcome  </h1>
  <p>Explore templates and categories</p>
  <button>Get Started</button>
</div>

<!-- 🔹 CATEGORIES -->
<div class="categories">
  <h3>Categories</h3>
  <div class="category-list">
    <span>Food</span>
    <span>Travel</span>
    <span>E-commerce</span>
    <span>Blog</span>
    <span>Portfolio</span>
  </div>
</div>

<!-- 🔹 CARDS -->
<div class="cards">

  <div class="card">
    <img src="https://via.placeholder.com/250x150">
    <h3>WordPress Themes</h3>
    <button>Preview</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/250x150">
    <h3>E-commerce Templates</h3>
    <button>Preview</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/250x150">
    <h3>Marketing Templates</h3>
    <button>Preview</button>
  </div>

</div>

<script>
/* 🔐 Protect page */
if (!localStorage.getItem("storedEmail")) {
  window.location.href = "index.html";
}

/* 🚪 Logout */
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}
</script>

</body>
</html>
