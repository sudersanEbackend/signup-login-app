<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Auth</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      margin: 0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 20px;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
    }

    .error {
      color: red;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<!-- SIGNUP -->
<div id="signupPage" class="container">
  <div class="box">
    <h2>Signup</h2>

    <input type="text" id="signupName" placeholder="Name" oninput="validateNameInput(this)">
    <div id="signupNameError" class="error"></div>

    <input type="email" id="signupEmail" placeholder="Email">
    <div id="signupEmailError" class="error"></div>

    <input type="text" id="signupMobile" placeholder="Mobile number"
       maxlength="10"
       oninput="validateMobileInput(this)">
    <div id="signupMobileError" class="error"></div>

    <input type="password" id="signupPassword" placeholder="Password">
    <div id="signupPasswordError" class="error"></div>

    <input type="password" id="signupConfirmPassword" placeholder="Confirm Password">
    <div id="signupConfirmPasswordError" class="error"></div>

    <button onclick="handleSignup()">Signup</button>
    <div id="signupFormError" class="error"></div>

    <p>Already have an account?
      <a href="#login" onclick="showPage('login')">Login</a>
    </p>
  </div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="container hidden">
  <div class="box">
    <h2>Login</h2>

    <input type="text" id="loginEmail" placeholder="Email or Mobile">
    <div id="loginEmailError" class="error"></div>

    <input type="password" id="loginPassword" placeholder="Password">
    <div id="loginPasswordError" class="error"></div>

    <button onclick="handleLogin()">Login</button>
    <div id="loginFormError" class="error"></div>

    <p>Don't have an account?
      <a href="#signup" onclick="showPage('signup')">Signup</a>
    </p>
  </div>
</div>

<script>
function showPage(page) {
  document.getElementById("signupPage").classList.add("hidden");
  document.getElementById("loginPage").classList.add("hidden");

  if (page === "signup") {
    document.getElementById("signupPage").classList.remove("hidden");
  } else {
    document.getElementById("loginPage").classList.remove("hidden");
  }
}

/* EMAIL VALIDATION */
function validateEmail(email) {
  const allowedDomains = [
    "@gmail.com",
    "@yahoo.com",
    "@yahoo.in",
    "@outlook.com",
    "@thestackly.com",
  ];

  const basicCheck = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!basicCheck.test(email)) return false;

  return allowedDomains.some(domain =>
    email.toLowerCase().endsWith(domain)
  );
}

/* PASSWORD VALIDATION */
function validatePassword(password) {
  const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
  return regex.test(password);
}

/* MOBILE INPUT VALIDATION */
function validateMobileInput(input) {
  input.value = input.value.replace(/\D/g, "");

  if (input.value.length > 10) {
    input.value = input.value.slice(0, 10);
  }
}

/* SIGNUP */
function handleSignup() {
  const name = signupName.value.trim();
  const email = signupEmail.value.trim().toLowerCase();
  const mobile = signupMobile.value.trim();
  const password = signupPassword.value;
  const confirmPassword = signupConfirmPassword.value;

  // CLEAR ALL ERRORS
  signupFormError.innerText = "";
  signupNameError.innerText = "";
  signupEmailError.innerText = "";
  signupMobileError.innerText = "";
  signupPasswordError.innerText = "";
  signupConfirmPasswordError.innerText = "";

  /* NAME */
  if (!name) {
    signupNameError.innerText = "Name is required";
    return;
  }

  /* EMAIL */
  if (!email) {
    signupEmailError.innerText = "Email is required";
    return;
  }

  if (!validateEmail(email)) {
    signupEmailError.innerText =
      "Only gmail, yahoo, outlook, thestackly emails are allowed";
    return;
  }

  /* MOBILE */
  if (!mobile) {
    signupMobileError.innerText = "Mobile number is required";
    return;
  }

  if (!/^\d{10}$/.test(mobile)) {
    signupMobileError.innerText = "Mobile must be exactly 10 digits";
    return;
  }

  /* PASSWORD */
  if (!password) {
    signupPasswordError.innerText = "Password is required";
    return;
  }

  if (!validatePassword(password)) {
    signupPasswordError.innerText =
      "Min 8 chars, include uppercase, lowercase, number & special symbol";
    return;
  }

  /* CONFIRM PASSWORD */
  if (!confirmPassword) {
    signupConfirmPasswordError.innerText = "Confirm your password";
    return;
  }

  if (password !== confirmPassword) {
    signupConfirmPasswordError.innerText = "Passwords do not match";
    return;
  }

  /* MULTIPLE USERS */
  let users = JSON.parse(localStorage.getItem("users")) || [];

  const exists = users.some(u => u.email === email || u.mobile === mobile);
  if (exists) {
    signupFormError.innerText = "User already exists";
    return;
  }

  let user = {
    name,
    email,
    mobile,
    password
  };

  users.push(user);
  localStorage.setItem("users", JSON.stringify(users));

  alert("Signup successful!");
  showPage("login");
}

/* LOGIN */
function handleLogin() {
  const id = loginEmail.value.trim().toLowerCase();
  const pass = loginPassword.value;

  const users = JSON.parse(localStorage.getItem("users")) || [];

  if (users.length === 0) {
    loginFormError.innerText = "Please signup first";
    return;
  }

  const foundUser = users.find(u =>
    (u.email === id || u.mobile === id) && u.password === pass
  );

    if (foundUser) {
  localStorage.setItem("isLoggedIn", "true");

  // ADDED THIS LINE FOR CURRENT USER 
  localStorage.setItem("currentUser", JSON.stringify(foundUser));

  alert("Login successful!");
    window.location.href = "home.html";
  } else {
    loginFormError.innerText = "Invalid credentials";
  }
}
</script>


</body>
</html>
